<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能抠图工具</title>
<style>
/* ===== ALL CSS INLINED - No external dependencies ===== */
:root{--bg:#E3F2FD;--primary:#1976D2;--accent:#42A5F5;--card:#FFFFFF;--text:#212121;--text-light:#757575;--success:#4CAF50;--danger:#F44336;--border:#E0E0E0;--radius:12px;--radius-sm:8px;--shadow:0 2px 12px rgba(0,0,0,.08);--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;line-height:1.6}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;box-shadow:var(--shadow);flex-shrink:0}
.header-inner{max-width:1200px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:1.25rem;font-weight:600;color:var(--primary)}
.version{font-size:.8rem;color:var(--text-light);background:#F5F5F5;padding:2px 8px;border-radius:10px}
.main{flex:1;max-width:1200px;width:100%;margin:24px auto;padding:0 24px}
.tabs{display:flex;gap:12px;margin-bottom:16px;justify-content:center}
.tab{padding:10px 32px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;font-family:var(--font)}
.tab:hover{border-color:var(--accent)}
.tab.active{border-color:var(--primary);background:var(--primary);color:#fff}
.mode-switch{display:flex;gap:8px;margin-bottom:20px;justify-content:center}
.mode-btn{padding:8px 24px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--text);font-size:.9rem;cursor:pointer;transition:all .2s;font-family:var(--font)}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn.active{border-color:var(--accent);background:#E3F2FD;color:var(--primary);font-weight:500}
.workspace{display:grid;grid-template-columns:380px 1fr;gap:20px;margin-bottom:20px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.panel-left{display:flex;flex-direction:column;gap:16px}
.panel-right{min-height:400px;display:flex;align-items:center;justify-content:center}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:40px 20px;text-align:center;transition:all .3s;cursor:pointer}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:#F0F8FF}
.upload-icon{font-size:3rem;margin-bottom:8px}
.upload-text{font-size:1rem;margin-bottom:4px}
.upload-hint{font-size:.8rem;color:var(--text-light);margin-bottom:12px}
.file-info{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#F5F5F5;border-radius:var(--radius-sm)}
.file-name{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{padding:10px 20px;border:none;border-radius:var(--radius-sm);font-size:.9rem;cursor:pointer;transition:all .2s;font-family:var(--font);display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#1565C0}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-lg{padding:12px 28px;font-size:1rem;width:100%;justify-content:center}
.btn-download{padding:12px 36px;font-size:1rem;font-weight:600;background:var(--success);color:#fff;border-radius:var(--radius)}
.btn-download:hover:not(:disabled){background:#43A047}
.btn-download:disabled{background:#BDBDBD}
.status{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#FFF8E1;border-radius:var(--radius-sm)}
.spinner{width:24px;height:24px;border:3px solid #E0E0E0;border-top:3px solid var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-text{font-size:.9rem}
.preview-empty{display:flex;align-items:center;justify-content:center;min-height:400px}
.preview-placeholder{text-align:center}
.preview-icon{font-size:4rem;margin-bottom:12px}
.preview-placeholder p{color:var(--text-light)}
.preview-content{width:100%}
.preview-images{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.preview-item{flex:1;min-width:200px;max-width:400px;text-align:center}
.preview-label{font-size:.85rem;color:var(--text-light);margin-bottom:8px;font-weight:500}
.preview-arrow{font-size:1.5rem;color:var(--accent);font-weight:bold}
.preview-img-wrap{background:#F5F5F5;border-radius:var(--radius-sm);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:200px;max-height:350px}
.preview-img-wrap img{max-width:100%;max-height:350px;object-fit:contain;display:block}
.checkerboard{background-image:linear-gradient(45deg,#E0E0E0 25%,transparent 25%),linear-gradient(-45deg,#E0E0E0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#E0E0E0 75%),linear-gradient(-45deg,transparent 75%,#E0E0E0 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0px}
.manual-tools{padding:16px;background:#F5F5F5;border-radius:var(--radius-sm);border:1px solid var(--border)}
.brush-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.brush-btn{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:.8rem;cursor:pointer;transition:all .2s;font-family:var(--font)}
.brush-btn:hover{border-color:var(--accent)}
.brush-btn.active{border-color:var(--success);background:#E8F5E9;color:var(--success);font-weight:500}
.brush-btn-danger:hover{border-color:var(--danger);color:var(--danger)}
.brush-size-label{font-size:.8rem;color:var(--text-light);margin-left:8px}
.brush-size-slider{width:80px;accent-color:var(--primary)}
.brush-size-value{font-size:.8rem;min-width:30px}
.brush-actions{text-align:center;display:flex;gap:8px;justify-content:center}
.canvas-container{width:100%;text-align:center}
.canvas-hint{font-size:.85rem;color:var(--text-light);margin-bottom:12px;padding:8px 16px;background:#FFF8E1;border-radius:var(--radius-sm);display:inline-block}
.video-preview-container{text-align:center;width:100%}
.video-meta{font-size:.8rem;color:var(--text-light);margin-top:8px}
.video-settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#F5F5F5;border-radius:var(--radius-sm);margin-top:8px}
.video-settings label{font-size:.85rem}
.video-settings select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:.85rem;margin-left:4px}
.progress-section{text-align:center;padding:16px 0}
.progress-bar-wrap{background:#E0E0E0;border-radius:10px;height:20px;overflow:hidden;margin-bottom:8px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--primary));border-radius:10px;transition:width .3s}
.progress-text{font-size:.9rem}
.bottom-bar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 24px}
.bottom-bar-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.color-section{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.color-label{font-size:.9rem;font-weight:500}
.color-presets{display:flex;gap:6px}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s}
.color-dot:hover{transform:scale(1.15)}
.color-dot.active{border-color:var(--primary);box-shadow:0 0 0 2px rgba(25,118,210,.3)}
.color-custom input[type=color]{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.color-value{font-size:.85rem;color:var(--text-light);font-family:monospace}
.footer{background:var(--card);border-top:1px solid var(--border);padding:16px 24px;text-align:center;flex-shrink:0}
.footer p{color:var(--text-light);font-size:.8rem}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.panel-right{min-height:250px}.preview-images{flex-direction:column}.preview-arrow{transform:rotate(90deg)}}
@media(max-width:600px){.header{padding:0 12px;height:50px}.logo{font-size:1rem}.main{margin:12px auto;padding:0 12px}.tabs{gap:8px}.tab{padding:8px 20px;font-size:.9rem}.panel{padding:16px}.bottom-bar-inner{flex-direction:column;align-items:stretch}.color-section{justify-content:center}.btn-download{width:100%;justify-content:center}}
</style>
</head>
<body>
<header class="header"><div class="header-inner"><h1 class="logo">🎨 智能抠图工具</h1><span class="version">v4.0</span></div></header>
<main class="main">
<div class="tabs"><button class="tab active" data-type="image" id="tabImage">📷 图片抠图</button><button class="tab" data-type="video" id="tabVideo">🎬 视频抠图</button></div>
<div class="mode-switch" id="modeSwitch"><button class="mode-btn active" data-mode="auto" id="modeAuto">🤖 自动抠图</button><button class="mode-btn" data-mode="manual" id="modeManual">✋ 手动抠图</button></div>
<div class="workspace">
<div class="panel panel-left">
<div class="upload-zone" id="uploadZone"><div class="upload-icon">📁</div><p class="upload-text" id="uploadText">拖拽图片到此处，或点击上传</p><p class="upload-hint" id="uploadHint">支持 JPG、PNG、WebP、BMP · 最大 20MB</p><input type="file" id="fileInput" accept="image/*" hidden><button class="btn btn-primary" id="btnUpload">选择文件</button></div>
<div class="file-info" id="fileInfo" style="display:none"><span class="file-name" id="fileName"></span><button class="btn btn-outline btn-sm" id="btnReupload">重新上传</button></div>
<div class="action-buttons" id="actionButtons" style="display:none"><button class="btn btn-primary btn-lg" id="btnRemoveBg">开始抠图</button></div>
<div class="status" id="statusBox" style="display:none"><div class="spinner" id="spinner"></div><p class="status-text" id="statusText"></p></div>
<div class="manual-tools" id="manualTools" style="display:none"><div class="brush-toolbar"><button class="brush-btn active" id="brushKeep">🟢 保留</button><button class="brush-btn" id="brushRemove">🔴 去除</button><span class="brush-size-label">大小:</span><input type="range" class="brush-size-slider" id="brushSize" min="2" max="50" value="10"><span class="brush-size-value" id="brushSizeValue">10px</span><button class="brush-btn" id="brushUndo">↩ 撤销</button><button class="brush-btn brush-btn-danger" id="brushClear">🗑 清除</button></div><div class="brush-actions"><button class="btn btn-primary btn-sm" id="btnManualApply">应用手动抠图</button></div></div>
</div>
<div class="panel panel-right">
<div class="preview-empty" id="previewEmpty"><div class="preview-placeholder"><div class="preview-icon">🖼️</div><p>请先上传一张图片</p></div></div>
<div class="preview-content" id="previewContent" style="display:none"><div class="preview-images"><div class="preview-item"><div class="preview-label">原图</div><div class="preview-img-wrap"><img id="previewOriginal" alt="原图"></div></div><div class="preview-arrow">→</div><div class="preview-item"><div class="preview-label">抠图结果</div><div class="preview-img-wrap checkerboard"><img id="previewResult" alt="结果"></div></div></div></div>
<div class="canvas-container" id="canvasContainer" style="display:none"><p class="canvas-hint">🖌️ 绿色=保留区域，红色=去除区域</p><canvas id="brushCanvas"></canvas></div>
<div class="progress-section" id="progressSection" style="display:none"><div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div><p class="progress-text" id="progressText">0%</p></div>
</div>
</div>
<div class="bottom-bar" id="bottomBar"><div class="bottom-bar-inner"><div class="color-section"><span class="color-label">背景颜色：</span><div class="color-presets" id="colorPresets"><button class="color-dot active" data-color="#FFFFFF" style="background:#FFFFFF"></button><button class="color-dot" data-color="#FF0000" style="background:#FF0000"></button><button class="color-dot" data-color="#4287f5" style="background:#4287f5"></button><button class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></button><button class="color-dot" data-color="#FFD700" style="background:#FFD700"></button><button class="color-dot" data-color="#FF69B4" style="background:#FF69B4"></button><button class="color-dot" data-color="#000000" style="background:#000000"></button></div><div class="color-custom"><input type="color" id="colorPicker" value="#FFFFFF"></div><span class="color-value" id="colorValue">#FFFFFF</span></div><button class="btn btn-download" id="btnDownload" disabled>⬇ 下载结果</button></div></div>
</main>
<footer class="footer"><p>智能抠图工具 v4.0 | 纯浏览器端运行 · 文件不会上传到任何服务器</p></footer>

<script src="https://cdn.bootcdn.net/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<script type="module">
try{const m=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.js');window.__bgPipeline=m.pipeline;}
catch{try{const m=await import('https://unpkg.com/@xenova/transformers@2.17.2/dist/transformers.js');window.__bgPipeline=m.pipeline;}
catch(e){console.warn('Transformers.js failed:',e.message)}}
</script>

<script>
// ===== utils.js =====
const $=id=>document.getElementById(id);
const Utils={el:$,show(id){$(id).style.display=''},hide(id){$(id).style.display='none'},flex(id){$(id).style.display='flex'},readFile(f){return new Promise((r,rej)=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.onerror=rej;fr.readAsDataURL(f)})},download(url,fn){const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();document.body.removeChild(a)},downloadBlob(b,fn){const u=URL.createObjectURL(b);this.download(u,fn);setTimeout(()=>URL.revokeObjectURL(u),5000)},formatSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB'},isImage(f){return f.type.startsWith('image/')}};
</script>

<script>
// ===== bg-remover.js =====
const BGRemover={_seg:null,_loading:false,async _load(){if(this._seg)return this._seg;if(this._loading){for(let i=0;i<300;i++){if(this._seg)return this._seg;await new Promise(r=>setTimeout(r,200))}throw new Error('Model timeout')}this._loading=true;try{if(!window.__bgPipeline)throw new Error('AI library not loaded. Please refresh.');this._seg=await window.__bgPipeline('image-segmentation','briaai/RMBG-1.4',{progress_callback:info=>{if(info.status==='downloading'&&window._onProg)window._onProg(Math.round(info.progress||0))}});return this._seg}finally{this._loading=false}},async removeBackground(input){const seg=await this._load();let url;if(input instanceof File||input instanceof Blob)url=URL.createObjectURL(input);else if(typeof input==='string')url=input;else{const c=document.createElement('canvas');c.width=input.naturalWidth||input.width;c.height=input.naturalHeight||input.height;c.getContext('2d').drawImage(input,0,0);url=c.toDataURL('image/png')}const res=await seg(url);if(!res||!res.length)throw new Error('No result');const mask=res[0].mask;const img=await new Promise((r,rej)=>{const i=new Image();i.onload=()=>r(i);i.onerror=rej;i.src=url});const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const cx=cv.getContext('2d');cx.drawImage(img,0,0);const id=cx.getImageData(0,0,cv.width,cv.height);for(let i=0;i<mask.data.length;i++)id.data[i*4+3]=Math.round(mask.data[i]*255);cx.putImageData(id,0,0);return new Promise(r=>cv.toBlob(b=>r(b),'image/png'))}};
</script>

<script>
// ===== color-replace.js =====
const ColorReplace={async apply(fgBlob,hex){const c=hex.replace('#','');const r=parseInt(c.substring(0,2),16),g=parseInt(c.substring(2,4),16),b=parseInt(c.substring(4,6),16);const fg=await new Promise((r,rej)=>{const i=new Image();i.onload=()=>r(i);i.onerror=rej;i.src=URL.createObjectURL(fgBlob)});const cv=document.createElement('canvas');cv.width=fg.width;cv.height=fg.height;const cx=cv.getContext('2d');cx.fillStyle=`rgb(${r},${g},${b})`;cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(fg,0,0);return new Promise(r=>cv.toBlob(b=>r(b),'image/png'))}};
</script>

<script>
// ===== canvas-brush.js =====
const BrushCanvas={canvas:null,brushMode:'keep',brushSize:10,init(id,url){if(this.canvas)this.canvas.dispose();if(typeof fabric==='undefined'){Utils.el('brushCanvas').parentElement.innerHTML='<p style="color:red">Canvas library not loaded. Please refresh.</p>';return}this.canvas=new fabric.Canvas(id,{isDrawingMode:true,backgroundColor:'#FFF'});fabric.Image.fromURL(url,img=>{const s=Math.min(1,580/img.width);this.canvas.setDimensions({width:Math.round(img.width*s),height:Math.round(img.height*s)});img.scale(s);img.set({selectable:false,evented:false});this.canvas.add(img);this.canvas.renderAll()});this.canvas.freeDrawingBrush.width=this.brushSize;this.canvas.freeDrawingBrush.color='#00FF00'},setMode(m){this.brushMode=m;this.canvas.isDrawingMode=true;this.canvas.freeDrawingBrush.color=m==='keep'?'#00FF00':'#FF0000'},setBrushSize(s){this.brushSize=s;this.canvas.freeDrawingBrush.width=s},undo(){const p=this.canvas.getObjects().filter(o=>o.type==='path');if(p.length>0){this.canvas.remove(p[p.length-1]);this.canvas.renderAll()}},clearAll(){this.canvas.getObjects().filter(o=>o.type==='path').forEach(o=>this.canvas.remove(o));this.canvas.renderAll()},destroy(){if(this.canvas){this.canvas.dispose();this.canvas=null}}};
</script>

<script>
// ===== app.js =====
const App={currentType:'image',currentMode:'auto',currentColor:'#FFFFFF',file:null,fgBlob:null,resultBlob:null,
init(){this.initTabs();this.initMode();this.initUpload();this.initActions();this.initColor();this.initBrush();},
initTabs(){document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');this.currentType=t.dataset.type;if(this.currentType==='video'){Utils.hide('modeSwitch');Utils.hide('manualTools');Utils.hide('previewContent')}else{Utils.show('modeSwitch')}}})},
initMode(){Utils.el('modeAuto').onclick=()=>this.switchMode('auto');Utils.el('modeManual').onclick=()=>this.switchMode('manual')},
switchMode(m){this.currentMode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));Utils.el(m==='auto'?'modeAuto':'modeManual').classList.add('active');if(m==='auto'){Utils.hide('manualTools');Utils.hide('canvasContainer');if(this.file){Utils.show('actionButtons');if(this.fgBlob)Utils.show('previewContent')}}else{if(!this.file){Utils.el('modeAuto').click();return}Utils.hide('actionButtons');Utils.hide('previewContent');Utils.show('manualTools');Utils.show('canvasContainer');this.initBrushCanvas()}},
initUpload(){const z=Utils.el('uploadZone'),inp=Utils.el('fileInput');Utils.el('btnUpload').onclick=()=>inp.click();Utils.el('btnReupload').onclick=()=>this.reset();inp.onchange=e=>{if(e.target.files[0])this.handleFile(e.target.files[0])};z.ondragover=e=>{e.preventDefault();z.classList.add('dragover')};z.ondragleave=()=>z.classList.remove('dragover');z.ondrop=e=>{e.preventDefault();z.classList.remove('dragover');if(e.dataTransfer.files[0])this.handleFile(e.dataTransfer.files[0])}},
async handleFile(f){this.file=f;this.fgBlob=null;this.resultBlob=null;Utils.el('fileName').textContent=f.name;Utils.hide('uploadZone');Utils.flex('fileInfo');Utils.show('actionButtons');const url=await Utils.readFile(f);Utils.el('previewOriginal').src=url;Utils.hide('previewEmpty');Utils.show('previewContent');Utils.el('previewResult').src='';Utils.el('btnDownload').disabled=true},
reset(){this.file=null;this.fgBlob=null;this.resultBlob=null;Utils.show('uploadZone');Utils.hide('fileInfo');Utils.hide('actionButtons');Utils.flex('previewEmpty');Utils.hide('previewContent');Utils.hide('canvasContainer');Utils.hide('manualTools');Utils.hide('statusBox');Utils.el('fileInput').value='';Utils.el('btnDownload').disabled=true;BrushCanvas.destroy()},
initActions(){Utils.el('btnRemoveBg').onclick=()=>this.doRemoveBg();Utils.el('btnDownload').onclick=()=>this.doDownload()},
initColor(){document.querySelectorAll('.color-dot').forEach(d=>{d.onclick=()=>{document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active'));d.classList.add('active');this.currentColor=d.dataset.color;Utils.el('colorValue').textContent=this.currentColor;if(this.fgBlob)this.doReplaceColor()}});Utils.el('colorPicker').oninput=()=>{this.currentColor=Utils.el('colorPicker').value;Utils.el('colorValue').textContent=this.currentColor;document.querySelectorAll('.color-dot').forEach(x=>x.classList.remove('active'));if(this.fgBlob)this.doReplaceColor()}},
async doRemoveBg(){if(!this.file)return;const btn=Utils.el('btnRemoveBg');btn.disabled=true;window._onProg=pct=>{Utils.el('statusText').textContent='Downloading AI model... '+pct+'%';Utils.flex('statusBox')};Utils.el('statusText').textContent='Loading AI model (first time ~170MB)...';Utils.flex('statusBox');try{const blob=await BGRemover.removeBackground(this.file);this.fgBlob=blob;Utils.el('previewResult').src=URL.createObjectURL(blob);Utils.show('previewContent');Utils.hide('statusBox');Utils.hide('actionButtons');window._onProg=null;await this.doReplaceColor()}catch(e){Utils.hide('statusBox');window._onProg=null;this.showError('Failed: '+(e.message||'Unknown'));btn.disabled=false}},
async doReplaceColor(){if(!this.fgBlob)return;try{this.resultBlob=await ColorReplace.apply(this.fgBlob,this.currentColor);Utils.el('previewResult').src=URL.createObjectURL(this.resultBlob);Utils.el('btnDownload').disabled=false}catch(e){this.showError('Color error: '+e.message)}},
doDownload(){if(!this.resultBlob&&!this.fgBlob)return;Utils.downloadBlob(this.resultBlob||this.fgBlob,'cutout_'+Date.now()+'.png')},
initBrush(){Utils.el('brushKeep').onclick=()=>{Utils.el('brushKeep').classList.add('active');Utils.el('brushRemove').classList.remove('active');BrushCanvas.setMode('keep')};Utils.el('brushRemove').onclick=()=>{Utils.el('brushRemove').classList.add('active');Utils.el('brushKeep').classList.remove('active');BrushCanvas.setMode('remove')};Utils.el('brushSize').oninput=function(){Utils.el('brushSizeValue').textContent=this.value+'px';BrushCanvas.setBrushSize(parseInt(this.value))};Utils.el('brushUndo').onclick=()=>BrushCanvas.undo();Utils.el('brushClear').onclick=()=>BrushCanvas.clearAll();Utils.el('btnManualApply').onclick=()=>this.doManualRemove()},
initBrushCanvas(){const img=Utils.el('previewOriginal');if(!img.src)return;BrushCanvas.init('brushCanvas',img.src)},
async doManualRemove(){try{Utils.el('statusText').textContent='Processing...';Utils.flex('statusBox');const blob=await BGRemover.removeBackground(this.file);this.fgBlob=blob;Utils.el('previewResult').src=URL.createObjectURL(blob);Utils.hide('canvasContainer');Utils.show('previewContent');Utils.hide('statusBox');Utils.hide('manualTools');await this.doReplaceColor()}catch(e){Utils.hide('statusBox');this.showError('Manual failed: '+e.message)}},
showError(msg){Utils.hide('statusBox');Utils.el('spinner').style.display='none';Utils.el('statusText').textContent='X '+msg;Utils.el('statusText').style.color='#F44336';Utils.flex('statusBox');setTimeout(()=>{Utils.el('statusText').style.color='';Utils.el('spinner').style.display='';Utils.hide('statusBox')},5000)}};
document.addEventListener('DOMContentLoaded',()=>{try{App.init()}catch(e){$('statusText').textContent='Error: '+e.message;$('statusBox').style.display='flex'}});
</script>
</body>
</html>
