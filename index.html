<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能抠图工具</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/classic.min.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <h1 class="logo">🎨 智能抠图工具</h1>
    <span class="version">v2.0 · 纯浏览器端</span>
  </div>
</header>

<main class="main">

  <!-- 选项卡 -->
  <div class="tabs">
    <button class="tab active" data-type="image" id="tabImage">📷 图片抠图</button>
    <button class="tab" data-type="video" id="tabVideo">🎬 视频抠图</button>
  </div>

  <!-- 模式切换 -->
  <div class="mode-switch" id="modeSwitch">
    <button class="mode-btn active" data-mode="auto" id="modeAuto">🤖 自动抠图</button>
    <button class="mode-btn" data-mode="manual" id="modeManual">✋ 手动抠图</button>
  </div>

  <!-- 工作区 -->
  <div class="workspace">
    <!-- 左侧 -->
    <div class="panel panel-left">
      <!-- 上传区 -->
      <div class="upload-zone" id="uploadZone">
        <div class="upload-icon">📁</div>
        <p class="upload-text" id="uploadText">拖拽图片到此处，或点击上传</p>
        <p class="upload-hint" id="uploadHint">支持 JPG、PNG、WebP、BMP · 最大 20MB</p>
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
        <button class="btn btn-primary" id="btnUpload">选择文件</button>
      </div>

      <!-- 文件信息 -->
      <div class="file-info" id="fileInfo" style="display:none">
        <span class="file-name" id="fileName"></span>
        <button class="btn btn-outline btn-sm" id="btnReupload">重新上传</button>
      </div>

      <!-- 操作按钮 -->
      <div class="action-buttons" id="actionButtons" style="display:none">
        <button class="btn btn-primary btn-lg" id="btnRemoveBg">开始抠图</button>
      </div>

      <!-- 处理中 -->
      <div class="status" id="statusBox" style="display:none">
        <div class="spinner" id="spinner"></div>
        <p class="status-text" id="statusText"></p>
      </div>

      <!-- 手动工具栏 -->
      <div class="manual-tools" id="manualTools" style="display:none">
        <div class="brush-toolbar">
          <button class="brush-btn active" id="brushKeep">🟢 保留</button>
          <button class="brush-btn" id="brushRemove">🔴 去除</button>
          <span class="brush-size-label">大小:</span>
          <input type="range" class="brush-size-slider" id="brushSize" min="2" max="50" value="10">
          <span class="brush-size-value" id="brushSizeValue">10px</span>
          <button class="brush-btn" id="brushUndo">↩ 撤销</button>
          <button class="brush-btn brush-btn-danger" id="brushClear">🗑 清除</button>
        </div>
        <div class="brush-actions">
          <button class="btn btn-primary btn-sm" id="btnManualApply">应用手动抠图</button>
        </div>
      </div>
    </div>

    <!-- 右侧 -->
    <div class="panel panel-right">
      <!-- 空状态 -->
      <div class="preview-empty" id="previewEmpty">
        <div class="preview-placeholder">
          <div class="preview-icon">🖼️</div>
          <p>请先上传一张图片</p>
        </div>
      </div>

      <!-- 图片预览 -->
      <div class="preview-content" id="previewContent" style="display:none">
        <div class="preview-images">
          <div class="preview-item">
            <div class="preview-label">原图</div>
            <div class="preview-img-wrap"><img id="previewOriginal" alt="原图"></div>
          </div>
          <div class="preview-arrow">→</div>
          <div class="preview-item">
            <div class="preview-label">抠图结果</div>
            <div class="preview-img-wrap checkerboard"><img id="previewResult" alt="结果"></div>
          </div>
        </div>
      </div>

      <!-- 视频预览 -->
      <div class="video-preview-container" id="videoPreviewContainer" style="display:none">
        <video id="videoPreview" controls style="max-width:100%;max-height:300px"></video>
        <p class="video-meta" id="videoMeta"></p>
      </div>

      <!-- Canvas（手动模式） -->
      <div class="canvas-container" id="canvasContainer" style="display:none">
        <p class="canvas-hint">🖌️ 绿色=保留区域，红色=去除区域</p>
        <canvas id="brushCanvas"></canvas>
      </div>

      <!-- 视频设置 -->
      <div class="video-settings" id="videoSettings" style="display:none">
        <label>缩放: <select id="videoScale">
          <option value="1">100%</option><option value="0.5" selected>50%</option><option value="0.25">25%</option>
        </select></label>
        <label>跳帧: <select id="videoSkip">
          <option value="1">每帧</option><option value="2" selected>每2帧</option><option value="3">每3帧</option><option value="5">每5帧</option>
        </select></label>
      </div>

      <!-- 进度 -->
      <div class="progress-section" id="progressSection" style="display:none">
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <p class="progress-text" id="progressText">0%</p>
      </div>
    </div>
  </div>

  <!-- 底部工具栏 -->
  <div class="bottom-bar" id="bottomBar">
    <div class="bottom-bar-inner">
      <div class="color-section">
        <span class="color-label">背景颜色：</span>
        <div class="color-presets" id="colorPresets">
          <button class="color-dot active" data-color="#FFFFFF" style="background:#FFFFFF"></button>
          <button class="color-dot" data-color="#FF0000" style="background:#FF0000"></button>
          <button class="color-dot" data-color="#4287f5" style="background:#4287f5"></button>
          <button class="color-dot" data-color="#4CAF50" style="background:#4CAF50"></button>
          <button class="color-dot" data-color="#FFD700" style="background:#FFD700"></button>
          <button class="color-dot" data-color="#FF69B4" style="background:#FF69B4"></button>
          <button class="color-dot" data-color="#000000" style="background:#000000"></button>
        </div>
        <div class="color-custom" id="colorPickerContainer"></div>
        <span class="color-value" id="colorValue">#FFFFFF</span>
      </div>
      <button class="btn btn-download" id="btnDownload" disabled>⬇ 下载结果</button>
    </div>
  </div>
</main>

<footer class="footer">
  <p>智能抠图工具 v2.0 | 纯浏览器端运行 · 文件不会上传到任何服务器</p>
</footer>

<!-- CDN fallback: if jsdelivr fails, try unpkg -->
<script>
window._cdnErrors = [];
function _cdnFallback(src, fallback) {
  var s = document.createElement('script');
  s.src = fallback;
  s.onerror = function(){ window._cdnErrors.push(fallback); };
  document.head.appendChild(s);
}
</script>
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.1/dist/fabric.min.js"
  onerror="_cdnFallback(this,'https://unpkg.com/fabric@5.3.1/dist/fabric.min.js')"></script>
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"
  onerror="_cdnFallback(this,'https://unpkg.com/@simonwep/pickr/dist/pickr.min.js')"></script>
<script type="module">
try {
  const m = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2/dist/transformers.js');
  window.__bgPipeline = m.pipeline;
} catch(e) {
  try {
    const m = await import('https://unpkg.com/@xenova/transformers@2.17.2/dist/transformers.js');
    window.__bgPipeline = m.pipeline;
  } catch(e2) {
    console.warn('Transformers.js load failed:', e2.message);
  }
}
</script>

<!-- 应用模块 -->
<script src="js/utils.js"></script>
<script src="js/bg-remover.js"></script>
<script src="js/color-replace.js"></script>
<script src="js/canvas-brush.js"></script>
<script src="js/video.js"></script>
<script src="js/app.js"></script>
</body>
</html>
